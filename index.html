<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xavier's family">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Xavier's family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx. 640px), cabecera fija con pestañas Agenda / Mes / Pendientes, botón flotante para añadir y hoja inferior para editar. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #eaeef5;
  --fg: #1b2333;
  --muted: #5d6879;
  --line: #d9dfe9;
  --accent: #26324a;
  --on-accent: #ffffff;
  --danger: #c0392b;
  --papa: #2d6fd6;   --papa-soft: #e3edfc;
  --mama: #d1477a;   --mama-soft: #fbe6ee;
  --juntos: #7556d1; --juntos-soft: #ede8fb;
  --xavier: #128a5c; --xavier-soft: #dff4ea;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  --shadow: 0 6px 24px rgba(27, 35, 51, .14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d; --surface: #1a202b; --surface-2: #242c39; --fg: #e8ecf3; --muted: #9aa5b6; --line: #2e3746;
    --accent: #e8ecf3; --on-accent: #11151d; --danger: #ef6b5d;
    --papa: #6ea3f2; --papa-soft: #1d2d47; --mama: #ef7fa7; --mama-soft: #3e2230;
    --juntos: #a690ee; --juntos-soft: #2c2547; --xavier: #4fc795; --xavier-soft: #173a2c;
    --shadow: 0 6px 24px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d; --surface: #1a202b; --surface-2: #242c39; --fg: #e8ecf3; --muted: #9aa5b6; --line: #2e3746;
  --accent: #e8ecf3; --on-accent: #11151d; --danger: #ef6b5d;
  --papa: #6ea3f2; --papa-soft: #1d2d47; --mama: #ef7fa7; --mama-soft: #3e2230;
  --juntos: #a690ee; --juntos-soft: #2c2547; --xavier: #4fc795; --xavier-soft: #173a2c;
  --shadow: 0 6px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.today::first-letter, .day-head h2::first-letter, .month-nav h2::first-letter { text-transform: uppercase; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--papa); outline-offset: 2px; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 8px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -.01em; line-height: 1.1; }
.brand .today { color: var(--muted); font-size: .85rem; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-top: 12px; }
.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tabs .count { font-variant-numeric: tabular-nums; font-weight: 500; opacity: .8; }

.filters { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 8px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: .9rem; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { border-color: var(--c, var(--fg)); background: var(--cs, var(--surface-2)); }
.chip[aria-pressed="false"] { opacity: .55; }
.chip[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }

main { padding-block: 8px 110px; }
.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 16px; color: var(--muted); margin-block: 8px; }
.notice strong { color: var(--fg); }

.day { margin-top: 18px; }
.day-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; }
.day-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.day-head .rel { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.day-head.is-today h2 { color: var(--papa); }
.list { display: grid; gap: 8px; }

.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--radius); padding: 12px 12px 12px 0; border: 1px solid var(--line); position: relative; overflow: hidden; text-align: left; width: 100%; }
.item::before { content: ""; align-self: stretch; width: 5px; background: var(--c); border-radius: 0 4px 4px 0; }
.item .body { min-width: 0; }
.item .title { font-weight: 600; overflow-wrap: anywhere; }
.item.done .title { text-decoration: line-through; color: var(--muted); }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: .82rem; margin-top: 2px; }
.item .meta .who { color: var(--c); font-weight: 600; }
.item .note { color: var(--muted); font-size: .85rem; margin-top: 4px; overflow-wrap: anywhere; white-space: pre-wrap; }
.item .time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .9rem; color: var(--fg); min-width: 44px; text-align: right; }
.check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--c); background: transparent; display: grid; place-items: center; padding: 0; }
.check svg { width: 16px; height: 16px; opacity: 0; color: #fff; }
.item.done .check { background: var(--c); }
.item.done .check svg { opacity: 1; }
.p-papa { --c: var(--papa); --cs: var(--papa-soft); }
.p-mama { --c: var(--mama); --cs: var(--mama-soft); }
.p-juntos { --c: var(--juntos); --cs: var(--juntos-soft); }
.p-xavier { --c: var(--xavier); --cs: var(--xavier-soft); }
.item-open { all: unset; cursor: pointer; display: block; min-width: 0; }
.item-open:focus-visible { outline: 2px solid var(--papa); outline-offset: 2px; border-radius: 6px; }

/* Mes */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.wk-day { margin-top: 14px; }
.wk-day .day-head { margin-bottom: 6px; }
.wk-empty { width: 100%; text-align: left; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: var(--radius); padding: 10px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
.wk-today-btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
.month-nav h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.grid .dow { text-align: center; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
.cell { aspect-ratio: 1 / 1.05; max-width: 100%; border: 1px solid transparent; background: var(--surface); border-radius: 10px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; font-weight: 500; }
.cell.out { background: transparent; color: var(--muted); opacity: .5; }
.cell.today .n { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 6px; }
.cell[aria-pressed="true"] { border-color: var(--fg); }
.cell .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 30px; }
.cell .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.sel-day { margin-top: 18px; }

/* Botón añadir */
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 6; border: 0; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 14px 20px 14px 16px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; box-shadow: var(--shadow); }
.fab svg { width: 20px; height: 20px; }
@media (min-width: 700px) { .fab { right: calc(50% - 320px + 16px); } }

/* Hoja */
.scrim { position: fixed; inset: 0; background: rgba(10,14,22,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px)); box-shadow: var(--shadow); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h3 { margin: 0 0 14px; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > label, .field > .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.field input, .field textarea, .field select { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.who-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
@media (min-width: 480px) { .who-grid { grid-template-columns: repeat(4, 1fr); } }
.opt { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 8px; font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: center; }
.opt .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); }
.opt[aria-pressed="true"] { border-color: var(--c, var(--fg)); background: var(--cs, var(--surface-2)); }
.actions { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.actions .right { display: flex; gap: 8px; margin-left: auto; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: transparent; background: transparent; padding-inline: 4px; }
.btn.danger.confirm { background: var(--danger); color: #fff; padding-inline: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.err { color: var(--danger); font-size: .88rem; margin: 0 0 10px; }
.hint { color: var(--muted); font-size: .85rem; margin: -4px 0 14px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: 999px; font-weight: 500; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.empty-art { display: flex; gap: 6px; margin-bottom: 10px; }
.empty-art i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
.section-title { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 20px 0 8px; }

/* Apartados */
main { padding-block: 8px calc(env(safe-area-inset-bottom, 0px) + 160px); }
.fab { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
.toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 148px); }
.section-name { color: var(--muted); font-size: .85rem; }
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
nav.bottom button { border: 0; background: transparent; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .74rem; font-weight: 600; color: var(--muted); }
nav.bottom button svg { width: 24px; height: 24px; }
nav.bottom button { transition: color .15s; }
nav.bottom button[data-sec] { --c: var(--fg); }
nav.bottom button[aria-current="page"] { color: var(--c); }
nav.bottom button[aria-current="page"] .ic { background: color-mix(in srgb, var(--c) 16%, transparent); }
nav.bottom .ic { border-radius: 999px; padding: 3px 16px; display: grid; place-items: center; }

/* A comprar */
.store { margin-top: 18px; }
.store-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.store-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; overflow-wrap: anywhere; }
.store-head .n { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.buy { --c: var(--accent); display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.buy .check { border-color: var(--muted); }
.buy.done .check { background: var(--muted); border-color: var(--muted); }
.buy.done .check svg { opacity: 1; }
.buy .name { font-weight: 600; overflow-wrap: anywhere; }
.buy.done .name { text-decoration: line-through; color: var(--muted); }
.qty { font-variant-numeric: tabular-nums; font-weight: 600; background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: .88rem; white-space: nowrap; }
.buy.done .qty { opacity: .6; }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.store-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.store-pills button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: .85rem; }
.row-qty { display: grid; grid-template-columns: 1fr 1.1fr; gap: 10px; }

/* Menú */
.week-hint { color: var(--muted); font-size: .84rem; margin: 2px 0 0; }
.week { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; margin-top: 12px; }
.week .colh { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; text-align: center; padding-bottom: 2px; }
.wday { border-radius: 12px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-variant-numeric: tabular-nums; }
.wday b { font-family: var(--font-display); font-size: .95rem; }
.wday span { font-size: .72rem; color: var(--muted); }
.wday.today { background: var(--accent); color: var(--on-accent); }
.wday.today span { color: var(--on-accent); opacity: .8; }
.meal { --tint: #ffb54d; position: relative; min-width: 0; min-height: 92px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 30px 8px 9px; text-align: left; background: color-mix(in srgb, var(--tint) 11%, var(--surface)); display: block; cursor: pointer; transition: transform .12s, box-shadow .12s, opacity .12s; }
.meal.cena { --tint: #7556d1; }
.meal .mt { font-size: .83rem; line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.meal.empty { background: transparent; border-style: dashed; color: var(--muted); display: grid; place-items: center; padding: 8px; font-size: .85rem; }
.meal .grip { position: absolute; top: 3px; right: 3px; width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: grid; place-items: center; touch-action: none; cursor: grab; padding: 0; }
.meal .grip:hover { background: color-mix(in srgb, var(--tint) 20%, transparent); }
.meal .grip svg { width: 16px; height: 16px; }
.meal.dragging { opacity: .3; }
.meal.drop-target { outline: 2.5px solid var(--papa); outline-offset: 1px; transform: scale(1.02); }
.meal.picked { outline: 2.5px dashed var(--papa); outline-offset: 1px; }
.drag-ghost { position: fixed; z-index: 40; pointer-events: none; margin: 0; box-shadow: 0 14px 30px -8px rgba(0,0,0,.35); transform: rotate(2deg) scale(1.03); opacity: .95; }
body.is-dragging { user-select: none; -webkit-user-select: none; }
.meal-day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-top: 10px; width: 100%; text-align: left; display: block; }
.meal-day.is-today { border-color: var(--fg); }
.meal-day h2 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; display: flex; gap: 8px; align-items: baseline; }
.meal-day h2 .rel { font-family: var(--font-body); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.meals { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
.meals dt { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; padding-top: 2px; }
.meals dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.meal-day .empty { color: var(--muted); font-size: .9rem; }
.menu-note { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Inicio */
.home-hello { margin: 14px 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.app { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.app:active { transform: scale(.98); }
.app .tile { width: 60px; height: 60px; border-radius: 19px; background: linear-gradient(145deg, var(--c1), var(--c2)); color: #fff; display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 6px rgba(0,0,0,.12), 0 8px 18px -6px var(--c2); position: relative; overflow: hidden; }
.app .tile::after { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,0)); pointer-events: none; }
.app { transition: transform .15s ease, box-shadow .15s ease; }
.app:hover { box-shadow: 0 6px 20px -8px rgba(27,35,51,.25); }
.app .tile svg { width: 32px; height: 32px; position: relative; z-index: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
.app .name { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.app .sub { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.a-agenda { --c1: #5b9bff; --c2: #2459d6; --c: #2f6fdb; } .a-compra { --c1: #3fd69a; --c2: #0d8a5d; --c: #12a06a; } .a-menu { --c1: #ff86ad; --c2: #d13d76; --c: #d9487a; } .a-fotos { --c1: #ad8dff; --c2: #6740d6; --c: #7556d1; } .a-inicio { --c: var(--fg); }
.home-today { margin-top: 22px; }
.app .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.apps .app.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; }
.a-avui { --c1: #ffd25e; --c2: #f08a24; --c: #d9761a; }
.avui-date { color: var(--muted); margin: 2px 0 6px; }
.avui-date::first-letter { text-transform: uppercase; }
.avui-block { margin-top: 20px; }

<script>window.XF_CONFIG = {"version": "6", "clientId": "81552258273-rj053ci47avd7a8j75hl3uogbg711184.apps.googleusercontent.com", "folderId": "1bnokMvQ8ofoV3mgSsR-StzbCubecYl00", "sheetTitle": "Xavier's family \u00b7 dades", "sheetId": "1kmVDrEAd_LtLubBjFgcpcUkGYVKVdy-bkknkYEmCuJU"};</script>

<script>
(function () {
  "use strict";
  const PEOPLE = ["papa", "mama", "juntos", "xavier"];
  const DEFAULT_NAMES = { papa: "Papa", mama: "Mama", juntos: "Junts", xavier: "Xavier" };
  const SECTIONS = ["inicio", "avui", "agenda", "feines", "compra", "menu", "fotos"];
  const AG_VIEWS = ["agenda", "setmana", "mes"];
  const DAYS = [["lunes", "Dilluns"], ["martes", "Dimarts"], ["miercoles", "Dimecres"], ["jueves", "Dijous"], ["viernes", "Divendres"], ["sabado", "Dissabte"], ["domingo", "Diumenge"]];
  const MEALS = [["comida", "Dinar"], ["cena", "Sopar"]];
  const UNITS = ["ud", "g", "kg", "ml", "l", "paquete", "docena", "lata", "bote"];
  const UNIT_LABEL = { ud: "u.", g: "g", kg: "kg", ml: "ml", l: "l", paquete: "paquet", docena: "dotzena", lata: "llauna", bote: "pot" };
  const state = {
    db: null, canWrite: true, names: { ...DEFAULT_NAMES },
    entries: [], tasks: [], events: [], extraEvents: {}, shop: [], menu: null,
    cal: { status: "loading", code: "", msg: "" }, mcp: null,
    drive: { status: "loading", code: "" }, uploadError: "", driveFiles: [], driveFolders: {}, thumbs: {}, uploading: null,
    loaded: { entries: false, cal: false, shop: false, menu: false }, slow: false, error: null,
    section: "inicio", view: "agenda", filter: new Set(PEOPLE),
    month: null, selDay: null, showPast: false, clearConfirm: false,
  };
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  try { const f = JSON.parse(ls.get("xf.filter") || "null"); if (Array.isArray(f) && f.length) { const g = f.filter(p => PEOPLE.includes(p)); if (g.length) state.filter = new Set(g); } } catch (e) {}
  if (AG_VIEWS.includes(ls.get("xf.view"))) state.view = ls.get("xf.view");
  const h0 = location.hash.slice(1);
  if (SECTIONS.includes(h0)) state.section = h0;

  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
    }
    for (const c of kids) if (c != null) n.append(c);
    return n;
  };
  const svgCheck = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.innerHTML = '<path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'; return s; };

  // Fechas
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayStr = () => ymd(new Date());
  const fmtDay = new Intl.DateTimeFormat("ca-ES", { weekday: "long", day: "numeric", month: "long" });
  const fmtMonth = new Intl.DateTimeFormat("ca-ES", { month: "long", year: "numeric" });
  const fmtShort = new Intl.DateTimeFormat("ca-ES", { day: "numeric", month: "short" });
  const relLabel = (s) => {
    const diff = Math.round((parse(s) - parse(todayStr())) / 86400000);
    if (diff === 0) return "Avui"; if (diff === 1) return "Demà"; if (diff === -1) return "Ahir";
    if (diff > 1 && diff < 7) return "D'aquí a " + diff + " dies";
    return "";
  };
  const validDate = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const validTime = (s) => typeof s === "string" && /^\d{2}:\d{2}$/.test(s);
  const str = (v, max) => String(v == null ? "" : v).slice(0, max);

  function cleanEntry(id, d) {
    if (!d) return null;
    return { id, src: "db", title: str(d.title, 200) || "(sense títol)", kind: d.kind === "tarea" ? "tarea" : "evento", who: PEOPLE.includes(d.who) ? d.who : "juntos",
      date: validDate(d.date) ? d.date : "", time: validTime(d.time) ? d.time : "", notes: str(d.notes, 2000), done: d.done === true, createdAt: typeof d.createdAt === "number" ? d.createdAt : 0 };
  }
  function cleanShop(id, d) {
    if (!d) return null;
    const qty = typeof d.qty === "number" && isFinite(d.qty) && d.qty > 0 ? d.qty : null;
    return { id, name: str(d.name, 120) || "(sense nom)", food: d.food === true, qty, unit: UNITS.includes(d.unit) ? d.unit : "ud",
      store: str(d.store, 40).trim(), done: d.done === true, createdAt: typeof d.createdAt === "number" ? d.createdAt : 0 };
  }
  const byWhen = (a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (a.time || "99").localeCompare(b.time || "99") || a.createdAt - b.createdAt;
  const visible = () => state.entries.filter(e => state.filter.has(e.who));
  const fmtQty = (it) => { if (!it.food || !it.qty) return ""; const n = String(Math.round(it.qty * 100) / 100).replace(".", ","); return n + " " + UNIT_LABEL[it.unit]; };
  const storeKey = (s) => s.trim().toLocaleLowerCase("ca");

  // ---------- Cabecera y navegación ----------
  function renderChrome() {
    setNavIcons();
    $("#todayLabel").textContent = fmtDay.format(new Date());
    document.querySelectorAll("nav.bottom button").forEach(b => { if (b.dataset.sec === state.section) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    $("#agendaBar").hidden = state.section !== "agenda" && state.section !== "feines";
    $("#agTabs").hidden = state.section !== "agenda";
    $("#bottomNav").hidden = state.section === "inicio";
    document.querySelector("main").style.paddingBottom = state.section === "inicio" ? "calc(env(safe-area-inset-bottom, 0px) + 40px)" : "";
    if (state.section === "agenda" || state.section === "feines") {
      document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
      const f = $("#filters"); f.replaceChildren();
      for (const p of PEOPLE) {
        f.append(el("button", { class: "chip p-" + p, "aria-pressed": String(state.filter.has(p)), onclick: () => {
          if (state.filter.has(p) && state.filter.size === 1) state.filter = new Set(PEOPLE);
          else if (state.filter.size === PEOPLE.length) state.filter = new Set([p]);
          else if (state.filter.has(p)) state.filter.delete(p); else state.filter.add(p);
          ls.set("xf.filter", JSON.stringify([...state.filter]));
          render();
        } }, el("span", { class: "dot" }), state.names[p]));
      }
    }
    const fab = $("#addBtn");
    const labels = { inicio: "", agenda: "Afegir", feines: "Afegir feina", compra: "Afegir", menu: "Editar el menú", fotos: "Pujar fotos" };
    fab.hidden = !state.canWrite || state.section === "inicio" || state.section === "avui" || state.section === "menu" || !state.db || state.section === "fotos";
    $("#addLabel").textContent = labels[state.section];
  }

  function statusNotes(main, key) {
    if (state.error) main.append(el("div", { class: "notice" }, el("strong", { text: "No es poden carregar les dades. " }), state.error));
    else if (key === "cal" && state.cal.status === "error") {}
    else if (key && !state.loaded[key] && state.slow) main.append(el("div", { class: "notice", text: "Triga a respondre. Comprova la connexió; les dades apareixeran soles quan arribin." }));
    else if (key && !state.loaded[key]) main.append(el("div", { class: "notice", text: "Carregant…" }));
    if (key === "cal" && state.cal.status === "error") main.append(calNotice());
    if (!state.canWrite && state.db && !state.error) main.append(el("div", { class: "notice", text: "Pots veure-ho tot, però no tens permís per afegir o canviar coses. Demana a qui va crear l'app que et convidi com a Editor." }));
  }
  function dotsArt() { const art = el("div", { class: "empty-art" }); PEOPLE.forEach(p => art.append(el("i", { class: "p-" + p }))); return art; }

  // ---------- Agenda ----------
  function itemNode(e, opts) {
    opts = opts || {};
    const meta = el("div", { class: "meta" }, el("span", { class: "who", text: state.names[e.who] }));
    if (opts.showDate && e.date) meta.append(el("span", { text: fmtShort.format(parse(e.date)) + (relLabel(e.date) ? " · " + relLabel(e.date) : "") }));
    if (e.kind === "tarea" && !opts.showDate && state.section !== "feines") meta.append(el("span", { text: "Feina" }));
    const body = el("button", { type: "button", class: "item-open", "aria-label": "Edita " + e.title, onclick: () => openEntrySheet(e) },
      el("div", { class: "title", text: e.title }), meta, e.notes ? el("div", { class: "note", text: e.notes }) : null);
    const wrap = el("div", { class: "item p-" + e.who + (e.done ? " done" : "") });
    wrap.style.gridTemplateColumns = e.kind === "tarea" ? "5px auto 1fr auto" : "5px 1fr auto";
    if (e.kind === "tarea") wrap.append(el("button", { type: "button", class: "check", "aria-label": e.done ? "Marca com a no fet" : "Marca com a fet", disabled: !state.canWrite, onclick: () => toggleDone("entries", e) }, svgCheck()));
    wrap.append(el("div", { class: "body" }, body), el("div", { class: "time", text: e.time || "" }));
    return wrap;
  }
  function emptyAgenda(text) {
    return el("div", { class: "notice" }, dotsArt(), el("strong", { text: text }), document.createTextNode(" Prem «Afegir» per apuntar un esdeveniment, i tria si és del " + state.names.papa + ", de la " + state.names.mama + ", de tots dos o del " + state.names.xavier + "."));
  }
  function groupByDay(list, container) {
    const days = new Map();
    for (const e of list) { if (!days.has(e.date)) days.set(e.date, []); days.get(e.date).push(e); }
    for (const [d, items] of days) {
      const rel = relLabel(d);
      const head = el("div", { class: "day-head" + (d === todayStr() ? " is-today" : "") }, el("h2", { text: fmtDay.format(parse(d)) }), rel ? el("span", { class: "rel", text: rel }) : null);
      const l = el("div", { class: "list" }); items.forEach(e => l.append(itemNode(e)));
      container.append(el("section", { class: "day" }, head, l));
    }
  }
  function renderAgenda(main) {
    const ok = state.loaded.cal && state.cal.status === "ok";
    if (state.view === "mes") return renderMonth(main);
    if (state.view === "setmana") return renderWeek(main);
    const t = todayStr();
    const dated = visible().filter(e => e.date && e.kind === "evento").sort(byWhen);
    const upcoming = dated.filter(e => e.date >= t);
    const past = dated.filter(e => e.date < t);
    if (!upcoming.length && ok) main.append(emptyAgenda(dated.length ? "No hi ha res properament." : "Encara no hi ha res apuntat."));
    groupByDay(upcoming, main);
    if (past.length) {
      main.append(el("div", { style: "margin-top:22px" }, el("button", { type: "button", class: "btn", onclick: () => { state.showPast = !state.showPast; render(); } }, state.showPast ? "Amaga el que ha passat" : "Mostra el que ha passat (" + past.length + ")")));
      if (state.showPast) groupByDay(past.reverse(), main);
    }
  }
  function renderWeek(main) {
    const now = new Date();
    if (!state.weekStart) state.weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
    const ws = state.weekStart;
    const end = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 6);
    ensureMonth(new Date(ws.getFullYear(), ws.getMonth(), 1)); ensureMonth(new Date(end.getFullYear(), end.getMonth(), 1));
    const move = (n) => { state.weekStart = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + n); render(); };
    const label = ws.getMonth() === end.getMonth() ? ws.getDate() + " – " + fmtShort.format(end) : fmtShort.format(ws) + " – " + fmtShort.format(end);
    const t = todayStr();
    const isThis = ymd(ws) <= t && t <= ymd(end);

    const f = r && r.payload; if (!f || typeof f.id !== "string") throw Object.assign(new Error("folder"), { code: "tool_error" });
    state.driveFolders[f.id] = { title, parentId, recent: Date.now() };
    return f.id;
  }
  function ensureFolder(year, month) {
    const key = year + "-" + month;
    if (!folderPromises[key]) folderPromises[key] = (async () => {
      let y = yearFolderId(year);
      if (!y) { if (!folderPromises["y" + year]) folderPromises["y" + year] = makeFolder(String(year), FOLDER_ID); y = await folderPromises["y" + year]; }
      return monthFolderId(y, month) || await makeFolder(pad(month) + " " + MONTHS_CA[month - 1], y);
    })().catch(e => { delete folderPromises[key]; delete folderPromises["y" + year]; throw e; });
    return folderPromises[key];
  }
  async function exifDate(file) {
    try {
      if (!/jpe?g/i.test(file.type) && !/\.jpe?g$/i.test(file.name)) return null;
      const buf = await file.slice(0, 256 * 1024).arrayBuffer(); const v = new DataView(buf);
      if (v.getUint16(0) !== 0xFFD8) return null;
      let o = 2;
      while (o + 4 < v.byteLength) {
        const mk = v.getUint16(o), len = v.getUint16(o + 2);
        if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
          const t = o + 10; const le = v.getUint16(t) === 0x4949;
          const u16 = (x) => v.getUint16(x, le), u32 = (x) => v.getUint32(x, le);
          const readAscii = (off, n) => { let s2 = ""; for (let i = 0; i < n - 1 && t + off + i < v.byteLength; i++) s2 += String.fromCharCode(v.getUint8(t + off + i)); return s2; };
          const ifd = (off) => { const out = {}; const n = u16(t + off); for (let i = 0; i < n; i++) { const e = t + off + 2 + i * 12; out[u16(e)] = { type: u16(e + 2), count: u32(e + 4), val: u32(e + 8) }; } return out; };
          const i0 = ifd(u32(t + 4)); let dt = null;
          if (i0[0x8769]) { const ex = ifd(i0[0x8769].val); if (ex[0x9003]) dt = readAscii(ex[0x9003].val, ex[0x9003].count); }
          if (!dt && i0[0x0132]) dt = readAscii(i0[0x0132].val, i0[0x0132].count);
          const m = dt && /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(dt);
          return m && m[1] > "1990" ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
        }
        if ((mk & 0xFF00) !== 0xFF00) break;
        o += 2 + len;
      }
    } catch (e) {}
    return null;
  }
  let fileArgsOk = null;
  async function uploadPhotos(files) {
    if (!state.mcp || !files.length) return;
    state.uploading = "Preparant " + files.length + (files.length === 1 ? " foto…" : " fotos…"); state.uploadError = ""; refresh();
    if (fileArgsOk === null) { try { const lt = await state.mcp.listTools(); fileArgsOk = lt && lt.fileArgs === true; } catch (e) { fileArgsOk = false; } }
    let ok = 0, fail = 0, lastErr = null;
    state.uploadError = "";
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      state.uploading = "Pujant " + (i + 1) + " de " + files.length + "…"; refresh();
      const slowT = setTimeout(() => { if (state.uploading) { state.uploading = "Pujant " + (i + 1) + " de " + files.length + "… Google Drive triga a respondre. Si l'app et demana permís per fer servir Google Drive, accepta'l."; refresh(); } }, 15000);
      try {
        const stamp = (await exifDate(file)) || (file.lastModified ? new Date(file.lastModified) : new Date());
        const folderId = await ensureFolder(stamp.getFullYear(), stamp.getMonth() + 1);
        const base = "Xavier " + ymd(stamp) + " " + pad(stamp.getHours()) + "." + pad(stamp.getMinutes()) + "." + pad(stamp.getSeconds()) + (files.length > 1 ? " (" + (i + 1) + ")" : "");
        const type = /^image\/(jpeg|png|gif|webp|heic|heif)$/.test(file.type) ? file.type : (/\.(heic|heif)$/i.test(file.name) ? "image/heic" : "image/jpeg");
        const ext = { "image/jpeg": "jpg", "image/png": "png", "image/gif": "gif", "image/webp": "webp", "image/heic": "heic", "image/heif": "heif" }[type];
        const resized = async () => {
          let loaded;
          try { loaded = await loadImg(file); }
          catch (e) {
            if (file.size <= 600 * 1024) return { title: base + "." + ext, parentId: folderId, contentMimeType: type, disableConversionToGoogleType: true, base64Content: await blobToB64(file) };
            throw Object.assign(new Error("decode"), { code: "decode" });
          }
          const { img, url } = loaded;
          let q = 0.85, max = 2048, blob = await drawScaled(img, max, "image/jpeg", q);
          while (blob && blob.size > 600 * 1024 && max > 800) { max = Math.round(max * 0.8); q = Math.max(0.6, q - 0.08); blob = await drawScaled(img, max, "image/jpeg", q); }
          URL.revokeObjectURL(url);
          if (!blob) throw Object.assign(new Error("decode"), { code: "decode" });
          return { title: base + ".jpg", parentId: folderId, contentMimeType: "image/jpeg", disableConversionToGoogleType: true, base64Content: await blobToB64(blob) };
        };
        let r;
        if (fileArgsOk && file.size <= 15 * 1024 * 1024) {
          try {
            r = await state.mcp.callTool(DRIVE_SERVER, "create_file", { title: base + "." + ext, parentId: folderId, contentMimeType: type, disableConversionToGoogleType: true, base64Content: { $file: { data: file, name: "foto." + ext, type } } }, { cache: false });
          } catch (e) {
            if (!["bad_request", "capability_disabled", "transform_error", "capability_removed"].includes(e && e.code)) throw e;
            fileArgsOk = false;
          }
        }
        if (!r) r = await state.mcp.callTool(DRIVE_SERVER, "create_file", await resized(), { cache: false });
        const made = r && r.payload && typeof r.payload.id === "string" ? r.payload : null;
        if (made) {
          try { const { img, url } = await loadImg(file); const tb = await drawScaled(img, THUMB_PX, "image/jpeg", 0.8); URL.revokeObjectURL(url); if (tb) state.thumbs[made.id] = { url: URL.createObjectURL(tb) }; } catch (e) {}
          const nf = filesFrom({ payload: { files: [made] } })[0];
          if (nf) { nf.recent = Date.now(); if (!nf.parentId) nf.parentId = folderId; state.driveFiles = [nf].concat(state.driveFiles.filter(x => x.id !== nf.id)); }
        }
        ok++;
      } catch (e) { fail++; lastErr = e; }
      clearTimeout(slowT);
    }
    state.uploading = null;
    state.mcp.invalidate(DRIVE_SERVER, "search_files").catch(() => {});
    setTimeout(() => loadDrive(true), 4000);
    if (fail) {
      const c = (lastErr && lastErr.code) || "desconegut";
      let why = c === "decode" ? "El mòbil ha donat la foto en un format que l'app no pot llegir (per exemple HEIC). Prova de triar-la des de «Fotos» en lloc de «Arxius», o configura la càmera en format JPG («Més compatible»)."
        : (c === "server_unavailable" || c === "upstream_error") ? "Google Drive no ha respost a temps. Mira la galeria abans de tornar-ho a provar, potser sí que s'ha pujat."
        : driveErrText(c);
      state.uploadError = (ok ? ok + " s'han pujat i " + fail + " no. " : "") + why + " (codi: " + c + ")";
      toast(ok ? ok + " pujades, " + fail + " amb error" : "No s'ha pogut pujar la foto");
    }
    else toast(ok === 1 ? "Foto desada al Drive" : ok + " fotos desades al Drive");
    refresh();
  }
  let lastPick = 0;
  function onPick(ev) {
    const now = Date.now(); if (now - lastPick < 800) return; lastPick = now;
    const fs = [...(ev.target.files || [])];
    try { ev.target.value = ""; } catch (e) {}
    if (!fs.length) { state.uploadError = "El mòbil no ha passat cap foto a l'app. (codi: no_files)"; state.section = "fotos"; render(); return; }
    if (!state.mcp) { state.uploadError = driveErrText("no_mcp") + " (codi: no_mcp)"; render(); return; }
    uploadPhotos(fs).catch(e => { state.uploading = null; state.uploadError = "Error inesperat en pujar: " + str(e && (e.code || e.message), 80) + " (codi: exception)"; render(); });
  }
  $("#photoInput").addEventListener("change", onPick);
  $("#photoInput").addEventListener("input", onPick);

  let viewerOpen = null;
  function closeViewer() { const v = $("#viewer"); v.hidden = true; v.replaceChildren(); if (viewerOpen && viewerOpen.url) URL.revokeObjectURL(viewerOpen.url); viewerOpen = null; render(); }
  function drawViewer() {
    const f = viewerOpen.file; const v = $("#viewer"); v.replaceChildren();
    const acts = el("div", { class: "acts" });
    if (f.viewUrl) acts.append(el("a", { class: "vbtn", href: f.viewUrl, target: "_blank", rel: "noopener", text: "Obre al Drive" }));
    if (state.canWrite) acts.append(el("button", { type: "button", class: "vbtn del" + (viewerOpen.confirm ? " confirm" : ""), onclick: async () => {
      if (!viewerOpen.confirm) { viewerOpen.confirm = true; drawViewer(); return; }
      try { await state.mcp.callTool(DRIVE_SERVER, "trash_file", { fileId: f.id }, { cache: false }); state.driveFiles = state.driveFiles.filter(x => x.id !== f.id); state.mcp.invalidate(DRIVE_SERVER, "search_files").catch(() => {}); closeViewer(); toast("Foto enviada a la paperera del Drive"); }
      catch (e) { toast(e && e.code === "tool_error" ? "Google Drive no deixa esborrar aquesta foto. Pots fer-ho des del Drive." : "No s'ha pogut esborrar. Torna-ho a provar."); viewerOpen.confirm = false; drawViewer(); }
    } }, viewerOpen.confirm ? "Sí, esborra-la" : "Esborra"));
    acts.append(el("button", { type: "button", class: "vbtn", onclick: closeViewer }, "Tanca"));
    v.append(el("div", { class: "vbar" }, el("span", { class: "t", text: f.title }), acts));
    const box = el("div", { class: "vimg" });
    if (viewerOpen.url) { const img = el("img", { alt: f.title }); img.src = viewerOpen.url; box.append(img); }
    else box.append(document.createTextNode(viewerOpen.failed ? "No s'ha pogut carregar la foto." : "Carregant…"));
    v.append(box);
  }
  async function openViewer(f) {
    viewerOpen = { file: f, url: null, failed: false, confirm: false };
    $("#viewer").hidden = false; drawViewer();
    try { const blob = await fetchImage(f); if (viewerOpen && viewerOpen.file === f) { viewerOpen.url = URL.createObjectURL(blob); drawViewer(); } }
    catch (e) { if (viewerOpen && viewerOpen.file === f) { viewerOpen.failed = true; drawViewer(); } }
  }
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && viewerOpen) closeViewer(); });

  // ---------- Datos compartidos ----------
  function refresh() { if (drag) return; if (!sheet) render(); else renderChrome(); }
  (async function connect() {
    const claude = window.claude;
    startCalendar();
    const db = claude && claude.use ? await claude.use("db") : null;
    if (!db) { state.error = "Entra amb el teu compte de Google per veure i apuntar coses."; state.canWrite = false; render(); return; }
    state.db = db;
    const user = await claude.use("user");
    if (user) { try { const w = await user.can("data.write"); if (w === false) state.canWrite = false; } catch (e) {} }
    const slow = setTimeout(() => { if (!state.loaded.entries || !state.loaded.shop || !state.loaded.menu) { state.slow = true; refresh(); } }, 10000);
    const doneLoading = () => { if (state.loaded.entries && state.loaded.shop && state.loaded.menu) { state.slow = false; clearTimeout(slow); } };
    const onErr = (e) => { clearTimeout(slow); state.error = e && e.code === "revoked" ? "Ja no tens accés a aquesta app." : "Torna a carregar la pàgina d'aquí a una estona."; refresh(); };
    db.collection("entries").onSnapshot((snap) => {
      state.tasks = snap.docs.map(d => cleanEntry(d.id, d.data())).filter(e => e && e.kind === "tarea");
      rebuildEntries();
      if (!snap.metadata.fromCache || snap.size) state.loaded.entries = true;
      doneLoading(); refresh();
    }, onErr);
    db.collection("shopping").onSnapshot((snap) => {
      state.shop = snap.docs.map(d => cleanShop(d.id, d.data())).filter(Boolean);
      if (!snap.metadata.fromCache || snap.size) state.loaded.shop = true;
      doneLoading(); refresh();
    }, onErr);
    db.doc("menu/semana").onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : null;
      state.menu = d && typeof d === "object" ? d : null;
      if (!snap.metadata.fromCache || snap.exists) state.loaded.menu = true;
      doneLoading(); refresh();
    }, onErr);
    db.doc("settings/family").onSnapshot((snap) => {
      const n = snap.exists && snap.data() && snap.data().names;
      const names = { ...DEFAULT_NAMES };
      if (n && typeof n === "object") for (const p of PEOPLE) if (typeof n[p] === "string" && n[p].trim()) names[p] = n[p].trim().slice(0, 24);
      state.names = names; refresh();
    }, () => {});
  })();
})();
</script>
